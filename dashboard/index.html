<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed Dashboard</title>
<style>
:root{--bg:#1e1f22;--panel:#2b2d31;--panel2:#313338;--line:#3f4147;--text:#f2f3f5;--muted:#b5bac1;--accent:#5865f2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:8px 12px;background:#4e5058;color:#fff}
button.primary{background:var(--accent)}
button.danger{background:#da373c}
button.small{padding:4px 8px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;background:#1e1f22;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase}
.hidden{display:none!important}
.center{min-height:100vh;display:grid;place-items:center}
.card{background:var(--panel);padding:28px;border-radius:12px;width:min(420px,92vw);text-align:center}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1;min-width:120px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.row{display:flex;align-items:center;gap:8px;background:var(--panel);padding:12px;border-radius:8px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.builder{display:grid;grid-template-columns:260px 1fr 300px;gap:12px;padding:12px;align-items:start}
@media(max-width:900px){.builder{grid-template-columns:1fr}}
.col{background:var(--panel);border-radius:8px;padding:10px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.node{display:flex;align-items:center;gap:6px;padding:6px;border-radius:6px;border:1px solid transparent;cursor:pointer;background:var(--panel2);margin-bottom:4px}
.node.sel{border-color:var(--accent)}
.node.child{margin-left:18px}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{padding:4px 8px;border-radius:12px;font-size:13px}
.badge.ok{background:rgba(35,165,89,.2);color:#57f287}
.badge.bad{background:rgba(242,63,67,.2);color:#ff7b7e}
.discord{background:var(--panel2);border-radius:8px;padding:14px;font-size:15px;line-height:1.4}
.msghead{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-weight:600}
.app{background:#5865f2;border-radius:4px;font-size:10px;padding:1px 4px}
.pbox{background:#2b2d31;border-left:4px solid #5865f2;border-radius:6px;padding:12px;margin:6px 0}
.pbox>*:first-child{margin-top:0}
.ptext h1,.ptext h2,.ptext h3{margin:4px 0}
.ptext h1{font-size:22px}
.ptext h2{font-size:18px}
.ptext h3{font-size:16px}
.ptext p{margin:2px 0}
.pdiv{margin:8px 0}
.pdiv.line{border-top:1px solid #4e5058}
.pdiv.large{padding:6px 0}
.pimgs{display:grid;gap:4px;margin:6px 0}
.pimgs img{width:100%;border-radius:6px;display:block}
.pbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pbtn{background:#4e5058;border-radius:4px;padding:6px 12px;font-size:14px}
.pbtn.blue{background:#5865f2}
.pbtn.green{background:#248046}
.pbtn.red{background:#da373c}
.psel{display:flex;justify-content:space-between;background:#1e1f22;border:1px solid #3f4147;border-radius:6px;padding:8px 10px;margin:6px 0;color:#b5bac1;font-size:14px}
.emoji{width:22px;height:22px;vertical-align:-5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:12px}
.modal{background:#2b2d31;border-radius:12px;padding:18px;width:min(420px,100%);max-height:90vh;overflow:auto}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.bcard{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
</style>
</head>
<body>

<div id="viewLogin" class="center hidden">
  <div class="card">
    <h1>Embed Dashboard</h1>
    <p id="loginMsg" class="muted">Not logged in.</p>
    <button class="primary" id="loginBtn">Log in with Discord</button>
  </div>
</div>

<div id="viewLibrary" class="hidden">
  <div class="top">
    <h1>My messages</h1>
    <button class="primary" id="newBtn">+ New message</button>
    <button id="logoutBtn">Log out</button>
  </div>
  <div class="wrap"><div id="list"></div></div>
</div>

<div id="viewBuilder" class="hidden">
  <div class="top">
    <button id="backBtn">&larr; Back</button>
    <input id="nameInput" style="flex:1;min-width:140px;max-width:260px" placeholder="Message name">
    <select id="guildSel" style="width:auto;max-width:200px" title="Server used for roles"></select>
    <span id="counter" class="badge ok"></span>
    <span id="problems" class="badge ok"></span>
    <button class="primary" id="saveBtn">Saved</button>
    <button class="primary" id="sendBtn">Send...</button>
  </div>
  <div class="builder">
    <div class="col">
      <div id="tabs"></div>
      <b>Message tree</b>
      <div id="tree" style="margin-top:8px"></div>
      <div class="muted" style="margin-top:8px">Add a part (goes inside a selected Box):</div>
      <div class="palette">
        <button class="small" data-add="text">Text</button>
        <button class="small" data-add="images">Images</button>
        <button class="small" data-add="divider">Divider</button>
        <button class="small" data-add="box">Box</button>
        <button class="small" data-add="button_row">Buttons</button>
        <button class="small" data-add="dropdown">Dropdown</button>
      </div>
    </div>
    <div class="col">
      <div class="discord">
        <div class="msghead"><span>Griedon Embeds</span><span class="app">APP</span></div>
        <div id="previewNote" class="muted" style="margin-bottom:6px"></div>
        <div id="preview"></div>
      </div>
    </div>
    <div class="col">
      <b>Settings</b>
      <div id="settings" style="margin-top:6px"></div>
    </div>
  </div>
</div>

<div id="sendOverlay" class="overlay hidden">
  <div class="modal">
    <h2 style="margin:0 0 6px">Send to Discord</h2>
    <label>Server</label><select id="sendGuild"></select>
    <label>Channel</label><select id="sendChannel"></select>
    <p id="sendStatus" class="muted" style="min-height:20px"></p>
    <div class="btnrow">
      <button class="primary" id="sendPost">Post as new</button>
      <button id="sendUpdate">Update posted message</button>
      <button id="sendClose">Close</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://h5nngnplb6.apps.bot-hosting.cloud".replace(/\/+$/, "");
const $ = (id) => document.getElementById(id);

function saveToken(t) { try { localStorage.setItem("token", t); } catch (e) {} }
function loadToken() { try { return localStorage.getItem("token"); } catch (e) { return null; } }
function clearToken() { try { localStorage.removeItem("token"); } catch (e) {} }

if (location.hash.startsWith("#token=")) {
  saveToken(location.hash.slice(7));
  history.replaceState(null, "", location.pathname);
}

function show(name) {
  for (const v of ["viewLogin", "viewLibrary", "viewBuilder"]) {
    $(v).classList.toggle("hidden", v !== name);
  }
}

async function api(path, opts = {}) {
  const res = await fetch(API_URL + path, {
    ...opts,
    headers: {
      ...(opts.headers || {}),
      "Content-Type": "application/json",
      Authorization: "Bearer " + loadToken(),
    },
  });
  if (res.status === 401) {
    clearToken();
    show("viewLogin");
    $("loginMsg").textContent = "Login expired. Please log in again.";
    throw new Error("login");
  }
  if (!res.ok) {
    let m = "Error " + res.status;
    try { const j = await res.json(); if (j.detail) m = j.detail; } catch (e) {}
    throw new Error(m);
  }
  return res.json();
}

let cur = null;
let selId = null;
let tab = "main";
let dirty = false;
let guilds = [];
let roles = [];
const uid = () => Math.random().toString(36).slice(2, 8);
const NAMES = { text: "Text", images: "Images", divider: "Divider", box: "Box", button_row: "Buttons", dropdown: "Dropdown" };

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function opts(list, selected) {
  return list.map((o) =>
    '<option value="' + esc(o[0]) + '"' + (o[0] === selected ? " selected" : "") + ">" + esc(o[1]) + "</option>"
  ).join("");
}

function inline(s) {
  s = esc(s);
  s = s.replace(/&lt;(a?):(\w+):(\d+)&gt;/g, (m, a, n, id) =>
    '<img class="emoji" src="https://cdn.discordapp.com/emojis/' + id + "." + (a ? "gif" : "png") + '" alt=":' + n + ':">');
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
  s = s.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#00a8fc">$1</a>');
  return s;
}

function md(text) {
  return text.split("\n").map((line) => {
    if (line.startsWith("### ")) return "<h3>" + inline(line.slice(4)) + "</h3>";
    if (line.startsWith("## ")) return "<h2>" + inline(line.slice(3)) + "</h2>";
    if (line.startsWith("# ")) return "<h1>" + inline(line.slice(2)) + "</h1>";
    if (line.startsWith("- ")) return "<p>&bull; " + inline(line.slice(2)) + "</p>";
    return "<p>" + (inline(line) || "&nbsp;") + "</p>";
  }).join("");
}

function newButton() {
  return { id: uid(), label: "Button", style: "grey", action: { type: "link", url: "https://" } };
}

function newOption() {
  return { id: uid(), label: "Option", description: "", action: { type: "reply", reply_id: "" } };
}

function newBlock(type) {
  const id = uid();
  if (type === "text") return { id, type, content: "Write your text here" };
  if (type === "images") return { id, type, urls: [""] };
  if (type === "divider") return { id, type, spacing: "small", line: true };
  if (type === "box") return { id, type, accent: "#5865F2", children: [] };
  if (type === "dropdown") return { id, type, placeholder: "Choose an option...", options: [newOption()] };
  return { id, type: "button_row", buttons: [newButton()] };
}

function normalize(layout) {
  if (!Array.isArray(layout.blocks)) layout.blocks = [];
  if (!Array.isArray(layout.replies)) layout.replies = [];
  const fix = (b) => {
    if (b.type === "box") b.children.forEach(fix);
    if (b.type === "button_row") {
      b.buttons.forEach((x) => {
        if (!x.action) x.action = { type: "link", url: x.url || "https://" };
        if (!x.style) x.style = "grey";
        delete x.url;
      });
    }
    if (b.type === "dropdown") {
      if (!Array.isArray(b.options)) b.options = [];
      b.options.forEach((o) => {
        if (!o.action) o.action = { type: "reply", reply_id: "" };
        if (o.description === undefined) o.description = "";
      });
    }
  };
  layout.blocks.forEach(fix);
  layout.replies.forEach((r) => {
    if (!Array.isArray(r.blocks)) r.blocks = [];
    r.blocks.forEach(fix);
  });
  return layout;
}

function activeReply() {
  if (tab === "main") return null;
  return cur.layout.replies.find((r) => r.id === tab) || null;
}

function activeBlocks() {
  const r = activeReply();
  return r ? r.blocks : cur.layout.blocks;
}

function findLoc(id) {
  const top = activeBlocks();
  for (let i = 0; i < top.length; i++) {
    if (top[i].id === id) return { list: top, index: i, parent: null };
    if (top[i].type === "box") {
      const kids = top[i].children;
      for (let j = 0; j < kids.length; j++) {
        if (kids[j].id === id) return { list: kids, index: j, parent: top[i] };
      }
    }
  }
  return null;
}

function markDirty() { dirty = true; }

function addBlock(type) {
  const b = newBlock(type);
  const loc = selId ? findLoc(selId) : null;
  if (loc && type !== "box") {
    const sel = loc.list[loc.index];
    if (sel.type === "box") sel.children.push(b);
    else if (loc.parent) loc.list.splice(loc.index + 1, 0, b);
    else activeBlocks().push(b);
  } else {
    activeBlocks().push(b);
  }
  selId = b.id;
  markDirty();
  renderAll();
}

function moveBlock(id, dir) {
  const loc = findLoc(id);
  if (!loc) return;
  const j = loc.index + dir;
  if (j < 0 || j >= loc.list.length) return;
  const tmp = loc.list[loc.index];
  loc.list[loc.index] = loc.list[j];
  loc.list[j] = tmp;
  markDirty();
  renderAll();
}

function removeBlock(id) {
  const loc = findLoc(id);
  if (!loc) return;
  loc.list.splice(loc.index, 1);
  if (selId === id) selId = null;
  markDirty();
  renderAll();
}

function addReply() {
  const r = { id: uid(), name: "Reply " + (cur.layout.replies.length + 1), blocks: [] };
  const box = newBlock("box");
  box.children.push({ id: uid(), type: "text", content: "Write the private reply here." });
  r.blocks.push(box);
  cur.layout.replies.push(r);
  tab = r.id;
  selId = null;
  markDirty();
  renderAll();
}

function countComponents(blocks) {
  let n = 0;
  const one = (b) => {
    n += 1;
    if (b.type === "box") b.children.forEach(one);
    if (b.type === "button_row") n += b.buttons.length;
    if (b.type === "dropdown") n += 1;
  };
  blocks.forEach(one);
  return n;
}

function countChars(blocks) {
  let n = 0;
  const one = (b) => {
    if (b.type === "text") n += b.content.length;
    if (b.type === "box") b.children.forEach(one);
  };
  blocks.forEach(one);
  return n;
}

function hasRoleActions() {
  let found = false;
  const one = (b) => {
    if (b.type === "box") b.children.forEach(one);
    if (b.type === "button_row" && b.buttons.some((x) => x.action.type === "role")) found = true;
    if (b.type === "dropdown" && b.options.some((o) => o.action.type === "role")) found = true;
  };
  cur.layout.blocks.forEach(one);
  cur.layout.replies.forEach((r) => r.blocks.forEach(one));
  return found;
}

function problemsFor(blocks, prefix, p) {
  const replyExists = (id) => cur.layout.replies.some((r) => r.id === id);
  const check = (b) => {
    if (b.type === "text" && !b.content.trim()) p.push(prefix + "has an empty text part");
    if (b.type === "images") {
      const u = b.urls.filter((x) => x.trim());
      if (!u.length) p.push(prefix + "has an image part with no link");
      if (u.some((x) => !x.trim().startsWith("https://"))) p.push(prefix + "has an image link not starting with https://");
      if (u.length > 10) p.push(prefix + "has more than 10 images in one part");
    }
    if (b.type === "button_row") {
      if (!b.buttons.length) p.push(prefix + "has an empty button row");
      if (b.buttons.length > 5) p.push(prefix + "has more than 5 buttons in a row");
      b.buttons.forEach((x) => {
        const a = x.action;
        if (!x.label.trim()) p.push(prefix + "has a button with no label");
        if (a.type === "link" && !a.url.trim().startsWith("https://")) p.push(prefix + "has a button link not starting with https://");
        if (a.type === "reply" && !replyExists(a.reply_id)) p.push(prefix + "has a button with no reply chosen");
        if (a.type === "role" && !a.role_id) p.push(prefix + "has a role button with no role chosen");
      });
    }
    if (b.type === "dropdown") {
      if (!b.options.length) p.push(prefix + "has a dropdown with no options");
      if (b.options.length > 25) p.push(prefix + "has a dropdown with more than 25 options");
      b.options.forEach((o) => {
        const a = o.action;
        if (!o.label.trim()) p.push(prefix + "has a dropdown option with no label");
        if (a.type === "reply" && !replyExists(a.reply_id)) p.push(prefix + "has a dropdown option with no reply chosen");
        if (a.type === "role" && !a.role_id) p.push(prefix + "has a dropdown option with no role chosen");
      });
    }
    if (b.type === "box") b.children.forEach(check);
  };
  blocks.forEach(check);
  if (!blocks.length) p.push(prefix + "is empty");
  if (countComponents(blocks) > 40) p.push(prefix + "has over 40 components");
  if (countChars(blocks) > 4000) p.push(prefix + "has over 4000 text characters");
}

function findProblems() {
  const p = [];
  problemsFor(cur.layout.blocks, "Main message ", p);
  cur.layout.replies.forEach((r) => problemsFor(r.blocks, 'Reply "' + r.name + '" ', p));
  return Array.from(new Set(p));
}

function label(b) {
  if (b.type === "text") return b.content.split("\n")[0].slice(0, 30) || "(empty)";
  if (b.type === "images") return b.urls.filter((x) => x.trim()).length + " image(s)";
  if (b.type === "box") return b.children.length + " part(s)";
  if (b.type === "button_row") return b.buttons.map((x) => x.label).join(", ").slice(0, 30);
  if (b.type === "dropdown") return b.options.length + " option(s)";
  return b.spacing + (b.line ? " line" : "");
}

function renderBlock(b) {
  if (b.type === "text") return '<div class="ptext">' + md(b.content) + "</div>";
  if (b.type === "images") {
    const u = b.urls.filter((x) => x.trim().startsWith("https://"));
    if (!u.length) return '<div class="muted">[image]</div>';
    const cols = u.length === 1 ? 1 : 2;
    return '<div class="pimgs" style="grid-template-columns:repeat(' + cols + ',1fr)">' +
      u.map((x) => '<img src="' + esc(x.trim()) + '" alt="">').join("") + "</div>";
  }
  if (b.type === "divider") {
    return '<div class="pdiv ' + (b.line ? "line " : "") + (b.spacing === "large" ? "large" : "") + '"></div>';
  }
  if (b.type === "button_row") {
    return '<div class="pbtns">' + b.buttons.map((x) => {
      const link = x.action.type === "link";
      return '<span class="pbtn ' + (link ? "" : esc(x.style || "grey")) + '">' + inline(x.label) + (link ? " &#8599;" : "") + "</span>";
    }).join("") + "</div>";
  }
  if (b.type === "dropdown") {
    return '<div class="psel"><span>' + esc(b.placeholder || "Choose an option...") + "</span><span>&#9662;</span></div>";
  }
  if (b.type === "box") {
    const c = /^#[0-9a-f]{6}$/i.test(b.accent) ? b.accent : "#5865F2";
    const inner = b.children.length ? b.children.map(renderBlock).join("") : '<div class="muted">Empty box</div>';
    return '<div class="pbox" style="border-left-color:' + c + '">' + inner + "</div>";
  }
  return "";
}

function treeRows(list, child) {
  return list.map((b) => {
    let html = '<div class="node' + (child ? " child" : "") + (b.id === selId ? " sel" : "") + '" data-id="' + b.id + '">' +
      '<span class="lbl"><b>' + NAMES[b.type] + "</b> " + esc(label(b)) + "</span>" +
      '<button class="small" data-act="up">&#9650;</button>' +
      '<button class="small" data-act="down">&#9660;</button>' +
      '<button class="small danger" data-act="del">&#10005;</button></div>';
    if (b.type === "box") html += treeRows(b.children, true);
    return html;
  }).join("");
}

function renderTabs() {
  const all = [{ id: "main", name: "Main message" }].concat(cur.layout.replies.map((r) => ({ id: r.id, name: r.name })));
  $("tabs").innerHTML = all.map((t) =>
    '<button class="small' + (t.id === tab ? " primary" : "") + '" data-tab="' + t.id + '">' + esc(t.name) + "</button>"
  ).join("") + '<button class="small" data-tab="__new">+ Reply</button>';
}

function renderTree() { $("tree").innerHTML = treeRows(activeBlocks(), false); }

function renderPreview() {
  $("previewNote").textContent = activeReply() ? "Private reply: only the person who clicked sees this." : "";
  $("preview").innerHTML = activeBlocks().map(renderBlock).join("");
}

function renderStatus() {
  const n = countComponents(activeBlocks());
  const probs = findProblems();
  const ce = $("counter");
  ce.textContent = n + "/40 components";
  ce.className = "badge " + (n > 40 ? "bad" : "ok");
  const pe = $("problems");
  pe.textContent = probs.length ? probs[0] + (probs.length > 1 ? " (+" + (probs.length - 1) + ")" : "") : "Ready to post";
  pe.className = "badge " + (probs.length ? "bad" : "ok");
  $("saveBtn").textContent = dirty ? "Save *" : "Saved";
}

function roleList() {
  return [["", "Choose..."]].concat(roles.map((r) => [r.id, r.name + (r.assignable ? "" : " (bot can't manage)")]));
}

function buttonEditor(x, i) {
  const a = x.action;
  let extra = "";
  if (a.type === "link") {
    extra = '<label>Link (https)</label><input data-f="burl" data-i="' + i + '" value="' + esc(a.url) + '">';
  }
  if (a.type === "reply") {
    if (cur.layout.replies.length) {
      const list = [["", "Choose..."]].concat(cur.layout.replies.map((r) => [r.id, r.name]));
      extra = '<label>Reply to show</label><select data-f="breply" data-i="' + i + '">' + opts(list, a.reply_id) + "</select>";
    } else {
      extra = '<p class="muted">Make a reply first with the "+ Reply" tab above the tree.</p>';
    }
  }
  if (a.type === "role") {
    extra = '<label>What it does</label><select data-f="bmode" data-i="' + i + '">' +
      opts([["toggle", "Toggle (add or remove)"], ["add", "Add the role"], ["remove", "Remove the role"]], a.mode) + "</select>" +
      '<label>Role</label><select data-f="brole" data-i="' + i + '">' + opts(roleList(), a.role_id) + "</select>";
  }
  const colour = a.type === "link" ? "" :
    '<label>Colour</label><select data-f="bstyle" data-i="' + i + '">' +
    opts([["grey", "Grey"], ["blue", "Blue"], ["green", "Green"], ["red", "Red"]], x.style) + "</select>";
  return '<div class="bcard"><label style="margin-top:0">Button ' + (i + 1) + " label</label>" +
    '<input data-f="blabel" data-i="' + i + '" value="' + esc(x.label) + '">' +
    '<label>When clicked</label><select data-f="baction" data-i="' + i + '">' +
    opts([["link", "Open a link"], ["reply", "Show a private reply"], ["role", "Give or remove a role"]], a.type) + "</select>" +
    extra + colour +
    '<button class="small danger" data-act2="delbtn" data-i="' + i + '" style="margin-top:8px">Remove button</button></div>';
}

function optionEditor(o, i) {
  const a = o.action;
  let extra = "";
  if (a.type === "reply") {
    if (cur.layout.replies.length) {
      const list = [["", "Choose..."]].concat(cur.layout.replies.map((r) => [r.id, r.name]));
      extra = '<label>Reply to show</label><select data-f="oreply" data-i="' + i + '">' + opts(list, a.reply_id) + "</select>";
    } else {
      extra = '<p class="muted">Make a reply first with the "+ Reply" tab above the tree.</p>';
    }
  }
  if (a.type === "role") {
    extra = '<label>What it does</label><select data-f="omode" data-i="' + i + '">' +
      opts([["toggle", "Toggle (add or remove)"], ["add", "Add the role"], ["remove", "Remove the role"]], a.mode) + "</select>" +
      '<label>Role</label><select data-f="orole" data-i="' + i + '">' + opts(roleList(), a.role_id) + "</select>";
  }
  return '<div class="bcard"><label style="margin-top:0">Option ' + (i + 1) + " label</label>" +
    '<input data-f="olabel" data-i="' + i + '" value="' + esc(o.label) + '">' +
    "<label>Small description (optional)</label>" +
    '<input data-f="odesc" data-i="' + i + '" value="' + esc(o.description || "") + '">' +
    '<label>When chosen</label><select data-f="oaction" data-i="' + i + '">' +
    opts([["reply", "Show a private reply"], ["role", "Give or remove a role"]], a.type) + "</select>" +
    extra +
    '<button class="small danger" data-act2="delopt" data-i="' + i + '" style="margin-top:8px">Remove option</button></div>';
}

function renderSettings() {
  const el = $("settings");
  const loc = selId ? findLoc(selId) : null;
  if (!loc) {
    const r = activeReply();
    if (r) {
      el.innerHTML = '<label>Reply name</label><input data-f="rname" value="' + esc(r.name) + '">' +
        '<p class="muted">Only the person who clicks the button sees this reply.</p>' +
        '<button class="small danger" data-act2="delreply">Delete this reply</button>';
    } else {
      el.innerHTML = '<p class="muted">Select a part in the tree to edit it.</p>';
    }
    return;
  }
  const b = loc.list[loc.index];
  let h = "";
  if (b.type === "text") {
    h = '<label>Text (supports Discord markdown and custom emoji)</label><textarea data-f="content">' + esc(b.content) + "</textarea>";
  }
  if (b.type === "images") {
    h = '<label>Image links (https, one per line, max 10)</label><textarea data-f="urls">' + esc(b.urls.join("\n")) + "</textarea>";
  }
  if (b.type === "divider") {
    h = '<label>Spacing</label><select data-f="spacing">' + opts([["small", "Small"], ["large", "Large"]], b.spacing) + "</select>" +
      '<label>Line</label><select data-f="line">' + opts([["1", "Show line"], ["0", "No line"]], b.line ? "1" : "0") + "</select>";
  }
  if (b.type === "box") {
    h = '<label>Accent colour</label><input type="color" data-f="accent" value="' + esc(b.accent) + '" style="height:44px;padding:2px">';
  }
  if (b.type === "button_row") {
    h = b.buttons.map(buttonEditor).join("") + '<button class="small" data-act2="addbtn">+ Add button</button>';
  }
  if (b.type === "dropdown") {
    h = '<label>Placeholder text</label><input data-f="dph" value="' + esc(b.placeholder || "") + '">' +
      b.options.map(optionEditor).join("") + '<button class="small" data-act2="addopt">+ Add option</button>';
  }
  el.innerHTML = h;
}

function renderAll() {
  if (!activeReply() && tab !== "main") tab = "main";
  renderTabs();
  renderTree();
  renderPreview();
  renderSettings();
  renderStatus();
}

$("tabs").addEventListener("click", (e) => {
  const t = e.target.dataset.tab;
  if (!t) return;
  if (t === "__new") { addReply(); return; }
  tab = t;
  selId = null;
  renderAll();
});

$("tree").addEventListener("click", (e) => {
  const node = e.target.closest(".node");
  if (!node) return;
  const id = node.dataset.id;
  const act = e.target.dataset.act;
  if (act === "up") moveBlock(id, -1);
  else if (act === "down") moveBlock(id, 1);
  else if (act === "del") removeBlock(id);
  else {
    selId = id;
    renderTree();
    renderSettings();
  }
});

$("settings").addEventListener("input", (e) => {
  const f = e.target.dataset.f;
  const v = e.target.value;
  if (!f) return;
  if (f === "rname") {
    const r = activeReply();
    if (r) r.name = v;
    markDirty();
    renderTabs();
    renderStatus();
    return;
  }
  const loc = findLoc(selId);
  if (!loc) return;
  const b = loc.list[loc.index];
  const i = Number(e.target.dataset.i);
  let again = false;
  if (f === "content") b.content = v;
  if (f === "urls") b.urls = v.split("\n");
  if (f === "spacing") b.spacing = v;
  if (f === "line") b.line = v === "1";
  if (f === "accent") b.accent = v;
  if (f === "blabel") b.buttons[i].label = v;
  if (f === "bstyle") b.buttons[i].style = v;
  if (f === "burl") b.buttons[i].action.url = v;
  if (f === "breply") b.buttons[i].action.reply_id = v;
  if (f === "bmode") b.buttons[i].action.mode = v;
  if (f === "brole") b.buttons[i].action.role_id = v;
  if (f === "baction") {
    if (v === "link") b.buttons[i].action = { type: "link", url: "https://" };
    if (v === "reply") b.buttons[i].action = { type: "reply", reply_id: "" };
    if (v === "role") b.buttons[i].action = { type: "role", mode: "toggle", role_id: "" };
    again = true;
  }
  if (f === "dph") b.placeholder = v;
  if (f === "olabel") b.options[i].label = v;
  if (f === "odesc") b.options[i].description = v;
  if (f === "oreply") b.options[i].action.reply_id = v;
  if (f === "omode") b.options[i].action.mode = v;
  if (f === "orole") b.options[i].action.role_id = v;
  if (f === "oaction") {
    if (v === "reply") b.options[i].action = { type: "reply", reply_id: "" };
    if (v === "role") b.options[i].action = { type: "role", mode: "toggle", role_id: "" };
    again = true;
  }
  markDirty();
  renderTree();
  renderPreview();
  renderStatus();
  if (again) renderSettings();
});

$("settings").addEventListener("click", (e) => {
  const act = e.target.dataset.act2;
  if (!act) return;
  if (act === "delreply") {
    if (!confirm("Delete this reply?")) return;
    cur.layout.replies = cur.layout.replies.filter((r) => r.id !== tab);
    tab = "main";
    selId = null;
    markDirty();
    renderAll();
    return;
  }
  const loc = findLoc(selId);
  if (!loc) return;
  const b = loc.list[loc.index];
  if (act === "addbtn") b.buttons.push(newButton());
  if (act === "delbtn") b.buttons.splice(Number(e.target.dataset.i), 1);
  if (act === "addopt" && b.options.length < 25) b.options.push(newOption());
  if (act === "delopt") b.options.splice(Number(e.target.dataset.i), 1);
  markDirty();
  renderAll();
});

document.querySelectorAll("[data-add]").forEach((btn) => {
  btn.onclick = () => addBlock(btn.dataset.add);
});

$("nameInput").addEventListener("input", () => { markDirty(); renderStatus(); });

$("guildSel").onchange = async () => {
  cur.layout.guild_id = $("guildSel").value;
  markDirty();
  await loadRoles();
  renderSettings();
  renderStatus();
};

async function loadGuilds() {
  if (guilds.length) return;
  try { guilds = await api("/guilds"); } catch (e) { guilds = []; }
}

async function loadRoles() {
  roles = [];
  const gid = cur.layout.guild_id;
  if (!gid) return;
  try { roles = await api("/guilds/" + gid + "/roles"); } catch (e) { roles = []; }
}

async function save() {
  cur.name = $("nameInput").value.trim() || "Untitled message";
  try {
    const body = JSON.stringify({ name: cur.name, layout: cur.layout });
    const saved = cur.id
      ? await api("/messages/" + cur.id, { method: "PUT", body })
      : await api("/messages", { method: "POST", body });
    cur.id = saved.id;
    dirty = false;
    renderStatus();
  } catch (e) {
    if (e.message !== "login") alert("Could not save: " + e.message);
  }
}
$("saveBtn").onclick = save;

async function openBuilder(msg) {
  msg.layout = normalize(msg.layout || {});
  cur = msg;
  selId = null;
  tab = "main";
  dirty = false;
  await loadGuilds();
  if (!cur.layout.guild_id && guilds.length) cur.layout.guild_id = guilds[0].id;
  $("guildSel").innerHTML = opts(guilds.map((g) => [g.id, g.name]), cur.layout.guild_id);
  $("nameInput").value = cur.name;
  await loadRoles();
  show("viewBuilder");
  renderAll();
}

async function openLibrary() {
  show("viewLibrary");
  $("list").innerHTML = '<p class="muted">Loading...</p>';
  try {
    const items = await api("/messages");
    if (!items.length) {
      $("list").innerHTML = '<p class="muted">No messages yet. Tap "+ New message".</p>';
      return;
    }
    $("list").innerHTML = items.map((m) =>
      '<div class="row"><div class="grow"><b>' + esc(m.name) + '</b><div class="muted">' +
      (m.posted_message_id ? "Posted" : "Draft") + " &middot; " + new Date(m.updated_at * 1000).toLocaleString() +
      '</div></div><button class="primary small" data-open="' + m.id + '">Open</button>' +
      '<button class="danger small" data-del="' + m.id + '">Delete</button></div>'
    ).join("");
  } catch (e) {
    if (e.message !== "login") $("list").innerHTML = '<p class="muted">Could not load: ' + esc(e.message) + "</p>";
  }
}

$("list").addEventListener("click", async (e) => {
  const openId = e.target.dataset.open;
  const delId = e.target.dataset.del;
  try {
    if (openId) await openBuilder(await api("/messages/" + openId));
    if (delId && confirm("Delete this message?")) {
      await api("/messages/" + delId, { method: "DELETE" });
      openLibrary();
    }
  } catch (err) {
    if (err.message !== "login") alert(err.message);
  }
});

$("newBtn").onclick = () => {
  const box = newBlock("box");
  box.children.push({ id: uid(), type: "text", content: "# Hello there\nStart writing your message." });
  openBuilder({ id: null, name: "Untitled message", layout: { blocks: [box], replies: [] } });
};

$("backBtn").onclick = () => {
  if (dirty && !confirm("Discard unsaved changes?")) return;
  openLibrary();
};

$("loginBtn").onclick = () => { location.href = API_URL + "/auth/login"; };
$("logoutBtn").onclick = () => { clearToken(); show("viewLogin"); $("loginMsg").textContent = "Logged out."; };

/* ---------- Send window ---------- */
const sg = $("sendGuild");
const sc = $("sendChannel");
const ss = $("sendStatus");
const postBtn = $("sendPost");
const updBtn = $("sendUpdate");
let fresh = null;

function setStatus(t) { ss.textContent = t; }

function refreshSendButtons() {
  updBtn.disabled = !(fresh && fresh.posted_message_id);
}

async function loadChannels(gid, wanted) {
  sc.innerHTML = "<option>Loading...</option>";
  try {
    const chans = await api("/guilds/" + gid + "/channels");
    if (!chans.length) {
      sc.innerHTML = "<option value=''>No channel the bot can write in</option>";
      return;
    }
    sc.innerHTML = chans.map((c) =>
      '<option value="' + c.id + '">#' + esc(c.name) + (c.category ? " (" + esc(c.category) + ")" : "") + "</option>"
    ).join("");
    if (wanted && chans.some((c) => c.id === wanted)) sc.value = wanted;
  } catch (e) {
    if (e.message !== "login") setStatus(e.message);
  }
}

sg.onchange = () => loadChannels(sg.value, null);

$("sendBtn").onclick = async () => {
  const probs = findProblems();
  if (probs.length) { alert("Fix this first: " + probs[0]); return; }
  await save();
  if (dirty || !cur.id) return;
  try {
    fresh = await api("/messages/" + cur.id);
    await loadGuilds();
    if (!guilds.length) { alert("The bot isn't in any server."); return; }
    sg.innerHTML = opts(guilds.map((g) => [g.id, g.name]), "");
    const wantGuild = fresh.guild_id || cur.layout.guild_id;
    if (wantGuild && guilds.some((g) => g.id === wantGuild)) sg.value = wantGuild;
    setStatus(fresh.posted_message_id ? "Already posted once. You can update it or post a new copy." : "Not posted yet.");
    refreshSendButtons();
    $("sendOverlay").classList.remove("hidden");
    await loadChannels(sg.value, fresh.channel_id);
  } catch (e) {
    if (e.message !== "login") alert(e.message);
  }
};

async function send(path, withTarget) {
  if (withTarget && hasRoleActions() && cur.layout.guild_id && sg.value !== cur.layout.guild_id) {
    setStatus("Role actions use roles from another server. Change the server at the top of the builder to match.");
    return;
  }
  setStatus("Sending...");
  postBtn.disabled = true;
  updBtn.disabled = true;
  try {
    const o = { method: "POST" };
    if (withTarget) o.body = JSON.stringify({ guild_id: sg.value, channel_id: sc.value });
    fresh = await api("/messages/" + cur.id + path, o);
    setStatus("Done! Check Discord.");
  } catch (e) {
    if (e.message !== "login") setStatus("Failed: " + e.message);
  }
  postBtn.disabled = false;
  refreshSendButtons();
}

postBtn.onclick = () => send("/post", true);
updBtn.onclick = () => send("/update", false);
$("sendClose").onclick = () => { $("sendOverlay").classList.add("hidden"); };
$("sendOverlay").onclick = (e) => { if (e.target === $("sendOverlay")) $("sendOverlay").classList.add("hidden"); };

async function start() {
  if (!loadToken()) { show("viewLogin"); return; }
  try {
    await api("/me");
    openLibrary();
  } catch (e) {
    if (e.message !== "login") {
      show("viewLogin");
      $("loginMsg").textContent = "Could not reach the bot. Is it online?";
    }
  }
}
start();
</script>
</body>
</html>
